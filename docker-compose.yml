version: '3.8'

services:
  backend:
    build:
      context: .                       # Project root — so model/ package is included
      dockerfile: backend/Dockerfile
    container_name: fakenews_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data             # Persistent SQLite + uploads
      - ./model/artifacts:/app/model/artifacts   # Dev: mount model artifacts live
      - ./reports:/app/reports
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=sqlite:////data/fakenews.db
      - UPLOAD_DIR=/data/uploads
      - MODEL_PATH=/app/model/artifacts
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fakenews_frontend
    restart: always
    ports:
      - "80:80"                        # Nginx serves on port 80 in production build
    depends_on:
      - backend

volumes:
  backend_data:
